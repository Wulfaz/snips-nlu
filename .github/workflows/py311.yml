name: Tests (Python 3.11 + current deps, Python 3.9 + pynab pins) and wheel
on:
  push:
    branches: [py311]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Rust-based dependencies, built from source on x86_64
  SNIPS_NLU_UTILS: "snips-nlu-utils @ git+https://github.com/Wulfaz/snips-nlu-utils@v0.9.1.post1#subdirectory=python"
  SNIPS_NLU_PARSERS: "snips-nlu-parsers @ git+https://github.com/Wulfaz/snips-nlu-parsers@py3-wheels#subdirectory=python"
  LANG: en_US.UTF-8
  PYTHONIOENCODING: UTF-8

jobs:
  test:
    name: "Python ${{ matrix.python }} (${{ matrix.deps }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            deps: current
            pins: ""
          - python: "3.9"
            deps: pynab pins
            pins: "numpy==1.21.4 scipy==1.6.2 scikit-learn==0.24.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install Rust-based dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools-rust setuptools wheel
          python -m pip install --no-build-isolation "${SNIPS_NLU_UTILS}" "${SNIPS_NLU_PARSERS}"

      - name: Install snips-nlu
        run: |
          [ -z "${{ matrix.pins }}" ] || python -m pip install ${{ matrix.pins }}
          python -m pip install -e . "mock>=2.0,<6" "checksumdir~=1.1.6"
          python -m pip install --no-deps "snips-nlu-metrics>=0.14.1,<0.15"
          python -m pip list | grep -i -E "numpy|scipy|scikit|crfsuite|snips|future"

      # Gazetteer entities were hosted on resources.snips.ai, which is gone; the
      # mirror (__entities_download_url__) only has the French music entities.
      # pynab only uses snips/datetime, a grammar entity built into the parser.
      - name: Download language resources (as pynab does, with current pip)
        run: |
          python -m snips_nlu download-all-languages
          for entity in snips/musicAlbum snips/musicArtist snips/musicTrack; do
            python -m snips_nlu download-entity $entity fr
          done

      - name: Unit tests
        run: python -m unittest discover -s snips_nlu/tests -t .

      - name: Sample
        run: python snips_nlu_samples/sample.py

      - name: Train on pynab's intents and check pynab's expectations
        run: |
          git clone -q --depth 1 -b bookworm https://github.com/Wulfaz/pynab.git /tmp/pynab
          for lang in en fr; do
            python -m snips_nlu generate-dataset $lang /tmp/pynab/*/nlu/intent_$lang.yaml > /tmp/nlu_dataset_$lang.json
            snips-nlu train /tmp/nlu_dataset_$lang.json /tmp/engine_$lang
          done
          python ci/pynab_nlu_check.py /tmp/engine_en /tmp/engine_fr

  wheel:
    name: "Universal wheel"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install build
          python -m build --wheel
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    name: "Attach wheel to release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
